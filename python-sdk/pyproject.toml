[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "allnewsapi"
version = "0.1.1"
description = "A Python SDK for AllNewsAPI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "AllNewsAPI", email = "contact@allnewsapi.com" },
]
keywords = ["news", "api", "sdk", "allnewsapi"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "hypothesis>=6.0"]

[project.urls]
Homepage = "https://github.com/AllNewsAPI/python-sdk"
BugTracker = "https://github.com/AllNewsAPI/python-sdk/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "SIM"]
ignore = ["SIM114"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["DTZ001", "PLC0206", "E501"]
