name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      contains(join(github.event.pull_request.changed_files.*.filename, ','), 'python-sdk/')
    defaults:
      run:
        working-directory: python-sdk
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -e ".[dev]" ruff
      - name: Lint
        run: ruff check src/ tests/
      - name: Test
        run: PYTHONPATH=src pytest tests/ -v

  typescript:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      contains(join(github.event.pull_request.changed_files.*.filename, ','), 'javascript-sdk/')
    defaults:
      run:
        working-directory: javascript-sdk
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: javascript-sdk/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npx eslint src/ || true
      - name: Format check
        run: npx prettier --check src/ || true
      - name: Test
        run: npx vitest run

  go:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      contains(join(github.event.pull_request.changed_files.*.filename, ','), 'go-sdk/')
    defaults:
      run:
        working-directory: go-sdk
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.21'
          cache: false
      - name: Lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          working-directory: go-sdk
      - name: Test
        run: go test ./... -v

  java:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      contains(join(github.event.pull_request.changed_files.*.filename, ','), 'java-sdk/')
    defaults:
      run:
        working-directory: java-sdk
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build and Test
        run: |
          mkdir -p target/classes target/test-classes
          find src/main -name "*.java" -exec javac -d target/classes {} +
          find src/test -name "*.java" -exec javac -cp target/classes -d target/test-classes {} +
          java -cp target/classes:target/test-classes com.allnewsapi.NewsAPITest

  php:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      contains(join(github.event.pull_request.changed_files.*.filename, ','), 'php-sdk/')
    defaults:
      run:
        working-directory: php-sdk
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@04c7ca5cdf3849c2db2777e8d3d97c6932b57601 # 2.9.0
        with:
          php-version: '8.2'
          extensions: curl, json
        env:
          COMPOSER_NO_INTERACTION: 1
      - name: Install dependencies
        run: composer install --no-interaction
      - name: Lint
        run: |
          composer require --dev friendsofphp/php-cs-fixer --no-interaction || true
          vendor/bin/php-cs-fixer fix --dry-run --diff src/ || true
      - name: Test
        run: vendor/bin/phpunit

  ruby:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      contains(join(github.event.pull_request.changed_files.*.filename, ','), 'ruby-sdk/')
    defaults:
      run:
        working-directory: ruby-sdk
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ruby/setup-ruby@e5517072e87f198d9533967ae13d97c11b604005 # v1.99.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          working-directory: ruby-sdk
      - name: Lint
        run: |
          gem install rubocop --no-document || true
          rubocop lib/ || true
      - name: Test
        run: bundle exec rake test
