name: Publish PHP SDK

on:
  push:
    tags:
      - 'php-sdk-v*'

permissions:
  contents: read

jobs:
  publish:
    name: Validate and notify Packagist
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: php-sdk

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up PHP
        uses: shivammathur/setup-php@04c7ca5cdf3849c2db2777e8d3d97c6932b57601 # 2.9.0
        with:
          php-version: '8.2'

      - name: Validate composer.json
        run: composer validate

      - name: Notify Packagist
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          if [ -n "$PACKAGIST_TOKEN" ]; then
            curl -s -X POST \
              "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}" \
              -d '{"repository":{"url":"https://github.com/${{ github.repository }}"}}'
          else
            echo "PACKAGIST_TOKEN not set, skipping notification"
          fi
