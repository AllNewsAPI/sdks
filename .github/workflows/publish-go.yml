name: Publish Go SDK

on:
  push:
    tags:
      - 'go-sdk/v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. go-sdk/v0.2.1). Runs current workflow logic against that ref.'
        required: true

permissions:
  contents: read

# Go modules are published automatically when a tag is pushed.
# pkg.go.dev indexes the module once the tag exists in the repository.
# This workflow validates the module and triggers pkg.go.dev indexing.
#
# Tags use the 'go-sdk/v<version>' format (slash, not dash) because the
# module lives in a subdirectory of this monorepo. Go's module proxy
# requires subdirectory modules to be tagged as '<subdir>/v<version>'.
# See: https://go.dev/ref/mod#vcs-version

jobs:
  publish:
    name: Validate and index Go module
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-sdk

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.22'

      - name: Verify module
        run: go mod verify

      - name: Request pkg.go.dev indexing
        env:
          REF_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          GOPROXY=https://proxy.golang.org GO111MODULE=on \
            go list -m github.com/AllNewsAPI/sdks/go-sdk@${REF_NAME#go-sdk/}
