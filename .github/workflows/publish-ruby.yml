name: Publish Ruby SDK

on:
  push:
    tags:
      - 'ruby-sdk-v*'

permissions:
  contents: read

jobs:
  publish:
    name: Build and push to RubyGems
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ruby-sdk

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Ruby
        uses: ruby/setup-ruby@e5517072e87f198d9533967ae13d97c11b604005 # v1.99.0
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build gem
        run: gem build allnewsapi.gemspec

      - name: Push to RubyGems
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: gem push allnewsapi-*.gem
